<!doctype html>
<html lang="en" data-theme="dark" data-fx="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LRWeb Console</title>
  <meta name="description" content="Onboard Linux servers and clients, manage CloudPanel sites and billing from one liquid-glass console.">
  <meta name="theme-color" content="#070824">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/font-03.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/font-15.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <!-- Refraction filter used by .glass--liquid on Chromium: wobbles the backdrop like thick curved glass. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="7" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <a class="skip" href="#main">Skip to content</a>

  <div class="shell">
    <aside class="sidebar glass glass--liquid" aria-label="Primary">
      <a class="brand" href="#/" aria-label="LRWeb Console home">
        <img class="brand__logo logo--on-dark" src="assets/brand/logo-light.png" width="300" height="69" alt="LRWeb">
        <img class="brand__logo logo--on-light" src="assets/brand/logo-dark.png" width="300" height="69" alt="LRWeb">
        <span class="brand__tag">Console</span>
      </a>
      <nav aria-label="Main"><ul class="nav-list" id="nav-list"></ul></nav>
      <div class="sidebar__foot">
        <div class="glass glass--thin tip">
          <span class="tip__icon" aria-hidden="true">⌘K</span>
          <p>Press <kbd>Ctrl</kbd> <kbd>K</kbd> to jump anywhere.</p>
        </div>
      </div>
    </aside>

    <div class="content">
      <header class="topbar glass glass--liquid">
        <button class="search-btn" id="open-palette" type="button" aria-label="Open command palette">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Search or jump to…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="pills" id="integration-pills" aria-label="Integration status"></div>
        <div id="user-slot"></div>
        <button class="icon-btn" id="toggle-theme" type="button" aria-label="Toggle light or dark theme">
          <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </header>
      <main id="main" class="view-host" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="overlay-root"></div>
  <noscript><p style="padding:2rem;color:#fff">LRWeb Console needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
